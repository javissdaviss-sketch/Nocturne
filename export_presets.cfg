[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="platform/*.ps1"
exclude_filter="tests/*,launcher/*,pipeline/*,.github/*"
export_path="../builds/windows/Nocturne.exe"
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
binary_format/architecture="x86_64"
texture_format/bptc=true
texture_format/s3tc=true
texture_format/etc2=false
codesign/enable=false
application/modify_resources=false
application/product_name="Fly Spy With My Little Eye"
application/file_description="A cozy cyberpunk murder mystery"
application/file_version="0.1.1.0"
application/product_version="0.1.1.0"

